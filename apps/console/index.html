<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="IWOMC Rescue Console: which contract is current, whether this checkout can be rescued now, and what happened when it ran."
    />
    <title>IWOMC Rescue Console</title>
    <link rel="icon" href="/signal-grid.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      THESIS: One question owns this surface - can this checkout be rescued right
      now - and the answer is an evidence document, not a KPI dashboard. It
      refuses the metric-tile grid every developer console ships.
      OWN-WORLD: Warm oat canvas, espresso sidebar, ivory contract documents with
      a ruled monospace header, terracotta reserved for the single dominant
      action and focus. IWOMC's four-square signal grid stands for declared,
      observed, locally checked, and clean verified.
      STORY: A teammate whose checkout is broken sees the exact contract bound to
      their revision, presses one action, and watches a factual timeline reach a
      terminal word.
      FIRST VIEWPORT: Espresso rail at 248px on the left; on the warm canvas a
      full-measure verdict panel answering the question in words, the signal grid
      beside it, and one terracotta "Rescue this checkout" action; the current
      contract document sits directly beneath it.
      FORM: Pinned by the brief (warm evidence-first console, TraceCase palette
      logic as reference only); no concept roll was run because a brief-pinned
      direction beats the roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <noscript>
      The Rescue Console needs JavaScript. Every action it offers is also
      available from the <code>iwomc</code> command line.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
